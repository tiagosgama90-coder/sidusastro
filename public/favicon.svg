<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Sidus">
  <rect width="64" height="64" rx="13" fill="#0B071E"/>
  <defs>
    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="45%" stop-color="#DFB76C"/>
      <stop offset="100%" stop-color="#B8944F"/>
    </radialGradient>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D08A"/>
      <stop offset="50%" stop-color="#DFB76C"/>
      <stop offset="100%" stop-color="#C9A55A"/>
    </linearGradient>
    <linearGradient id="fav-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0D08A"/>
      <stop offset="50%" stop-color="#DFB76C"/>
      <stop offset="100%" stop-color="#C9A55A"/>
    </linearGradient>
    <filter id="fav-star" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Centrado no quadrado: zoom ligeiro sobre o lockup stacked original -->
  <g transform="translate(32 32) scale(0.285) translate(-100 -104)">
    <g transform="translate(76 8) scale(1.15)">
      <path d="M24 10 L36 22 L12 32 L34 44 L14 54" stroke="url(#fav-gold)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="54" r="2.1" fill="url(#fav-gold)"/>
      <circle cx="34" cy="44" r="2.1" fill="url(#fav-gold)"/>
      <circle cx="12" cy="32" r="2.1" fill="url(#fav-gold)"/>
      <circle cx="36" cy="22" r="2.1" fill="url(#fav-gold)"/>
      <circle cx="24" cy="10" r="3.2" fill="url(#fav-glow)" filter="url(#fav-star)"/>
      <circle cx="24" cy="58" r="2" fill="url(#fav-gold)" opacity="0.9"/>
    </g>
    <text x="100" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="7.2" fill="url(#fav-text)">SIDUS</text>
  </g>
</svg>
