# Publica firestore.rules no Firebase quando o ficheiro muda em master.
# Não usa Netlify — corre no GitHub Actions (plano gratuito generoso).
#
# Configuração única no GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#   Nome: FIREBASE_SERVICE_ACCOUNT
#   Valor: o mesmo JSON da service account que já tens no Netlify (uma linha)

name: Deploy Firestore Rules

on:
  push:
    branches:
      - master
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project sidus-app --non-interactive
